[project]
name = "hyground"
version = "0.1.0"
description = "Language server for Hy with Python interop"
readme = "README.md"
authors = [
    { name = "Raj" }
]
license = "MIT"
keywords = ["hy", "hylang", "lsp", "language-server", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Lisp",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
]
requires-python = ">=3.10"
dependencies = [
    "hy>=1.2.0",
    "pygls>=1.3.1",
    "typeshed-client>=2.11.0",
]

[project.urls]
Repository = "https://github.com/rajp152k/HyGround"
Issues = "https://github.com/rajp152k/HyGround/issues"

[project.scripts]
hyground = "hyground.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "e2e: starts the HyGround LSP over stdio and speaks JSON-RPC",
]
