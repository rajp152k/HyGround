[project]
name = "hyground"
version = "0.1.0"
description = "A principled Hy language server with Python interop"
readme = "README.md"
authors = [
    { name = "Raj", email = "rajp152k@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "hy>=1.2.0",
    "pygls>=1.3.1",
]

[project.scripts]
hyground = "hyground.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
